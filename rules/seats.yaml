# 席位声明（S4-3）：每个号位「是人还是模型」的声明表。
#
# 两层来源，**世界包优先、规则层兜底**：
# - 世界包：`worlds/<id>/ui/seats.yaml`（本世界的席位安排与默认人选）
# - 规则层：本文件（通用默认，谁都可以用的框架级声明）
#
# 每席字段：
# - `index`：号位序号（1 起）
# - `label`：显示名（不含世界语义，框架只显示不解释）
# - `agent`：默认 agent id（空 = 用世界默认）
# - `human`：这一席默认由真人坐（房间页可临时切换）
#
# 零世界词：这里只写「号位 / 人 / 模型」，阵营与身份由世界包另行声明。
schema_version: 1

default:
  label: "{index} 号位"
  agent: ""
  human: false

seats:
  - index: 1
    label: "主玩家"
    human: true
