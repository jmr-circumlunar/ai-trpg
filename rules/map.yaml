schema_version: 1

# 地图生成参数（唯一真相；代码只读不算）
# 主场景（地点表里的那些）不在这里定义——它们在 worlds/<id>/regions/*.md。
# 这里只管「次要建筑」怎么随机：数量区间、方位枚举、连通度上限。

# 方位枚举：生成时从这里挑，不写死中文
bearings: [北, 东北, 东, 东南, 南, 西南, 西, 西北]

# 每个区域生成几个次要建筑（可按区域覆盖）
secondary:
  default: {min: 1, max: 3}
  regions: {}          # 例：campus: {min: 2, max: 4}

# 单个地点最多连几条路（防止某个门厅连到全图）
max_degree: 5

# 次要建筑的兜底名（LLM 起名失败时用；不允许代码里写死地名到 trpg/）
fallback_names: [旧巷, 空仓, 侧院, 修了一半的棚, 废仓, 后楼梯]

# 出口未在文档里声明时，主场景按文档顺序成环（确定性，同 seed 同图）
ring_topology: true
