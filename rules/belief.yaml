# 信念聚合（S2-3）的数值参数：**唯一真相源**。
#
# 纪律（AGENTS.md「数值真相源」）：代码只读不算；改参数就改这里，不改代码。
#
# 四步算法（对应参考 C-4 的 deepwolf 概率 copilot）：
#   先验 → 硬化（已确认项取 0/1）→ 微调（只对不确定项）→ 守恒重归一
# 跨轮平滑把「即时判断」与「长期信任」分开：即时判断权重 `smooth.weight`，
# 长期信任权重 = 1 − 该权重（上一轮的怀疑度）。
#
# **具体「什么算已确认」不在这里**：那是世界内容，由世界包 `knowledge.yaml: belief:` 声明。

prior:
  # 先验 = 剩余敌数 / 未知候选数；先验下限（候选为 0 时也不报错）
  floor: 0.0

harden:
  # 硬化：世界包声明为「已确认是敌人 / 已确认是自己人」→ 直接取这两个值
  enemy_confidence: 1.0
  ally_confidence: 0.0

adjust:
  # 微调：只对**不确定项**生效，单次相对先验的偏移上限
  max_delta: 0.3
  # 微调后的取值区间
  min: 0.0
  max: 1.0

smooth:
  # 即时判断权重（0..1）；长期信任权重 = 1 − weight
  weight: 0.6

conservation:
  # 守恒：未确认项的怀疑度之和 = 剩余敌数；判定容差
  epsilon: 0.0001
  # 没有可用权重时（和为 0）是否均分
  equal_share_fallback: true
