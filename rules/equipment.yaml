schema_version: 1

# 封闭 tag 词表（装备只能打这些 tag）
tag_vocab:
  - blade
  - blunt
  - polearm
  - ranged
  - armor
  - shield
  - light
  - heavy
  - climb
  - lockpick
  - light_source
  - heal
  - fire
  - stealth
  - disguise
  - document
  - tool
  - container
  - consumable
  - arcane

# tier 基础区间（attrs 主值）
tier_range:
  1: {weapon: [1, 2], armor: [1, 2], trinket: [0, 1]}
  2: {weapon: [2, 4], armor: [2, 3], trinket: [1, 2]}
  3: {weapon: [4, 7], armor: [3, 5], trinket: [2, 3]}
  4: {weapon: [7, 11], armor: [5, 7], trinket: [3, 5]}
  5: {weapon: [11, 16], armor: [7, 10], trinket: [5, 8]}

# 仅用于成色骰，与 stage_mod（DC 用）不同
stage_quality_mod: {1: 0, 2: 0, 3: 1, 4: 1}

quality:
  rough:     {roll: [2, 5],   mult: 0.6, tags: 0}
  common:    {roll: [6, 8],   mult: 1.0, tags: 0}
  fine:      {roll: [9, 10],  mult: 1.3, tags: 1}
  rare:      {roll: [11, 12], mult: 1.7, tags: 2, effects: 1}
  legendary: {roll: [13, 99], mult: 2.5, tags: 2, effects: 2, require: {tension_gt: 70}}

# 边际递减：同一局第 2 件起倍率
quality_diminishing: [1.0, 0.8, 0.6]

# 各时代允许的 tag（era 管合法性，不管强度档）
era_pool:
  medieval:
    allow: [blade, blunt, polearm, armor, shield, light, heavy, climb, light_source, heal,
            fire, stealth, disguise, document, tool, container, consumable, arcane]
  modern:
    allow: [blade, blunt, ranged, armor, light, climb, lockpick, light_source, heal,
            fire, stealth, tool, container, consumable]

# 定价：price = 10 * tier^2 * quality_mult * (1 + 0.2 * enhance)
pricing:
  base: 10
  tier_exp: 2
  enhance_factor: 0.2

# 初始配装预算：budget = 20 + 5 * (level - 1)
starter_budget:
  base: 20
  per_level: 5
