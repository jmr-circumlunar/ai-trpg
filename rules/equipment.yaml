schema_version: 1

# 封闭 tag 词表（装备只能打这些 tag）
tag_vocab:
  - blade
  - blunt
  - polearm
  - ranged
  - armor
  - shield
  - light
  - heavy
  - climb
  - lockpick
  - light_source
  - heal
  - fire
  - stealth
  - disguise
  - document
  - tool
  - container
  - consumable
  - arcane

# tier 基础区间（attrs 主值）
tier_range:
  1: {weapon: [1, 2], armor: [1, 2], trinket: [0, 1]}
  2: {weapon: [2, 4], armor: [2, 3], trinket: [1, 2]}
  3: {weapon: [4, 7], armor: [3, 5], trinket: [2, 3]}
  4: {weapon: [7, 11], armor: [5, 7], trinket: [3, 5]}
  5: {weapon: [11, 16], armor: [7, 10], trinket: [5, 8]}

# 仅用于成色骰，与 stage_mod（DC 用）不同
stage_quality_mod: {1: 0, 2: 0, 3: 1, 4: 1}

quality:
  rough:     {roll: [2, 5],   mult: 0.6, tags: 0}
  common:    {roll: [6, 8],   mult: 1.0, tags: 0}
  fine:      {roll: [9, 10],  mult: 1.3, tags: 1}
  rare:      {roll: [11, 12], mult: 1.7, tags: 2, effects: 1}
  legendary: {roll: [13, 99], mult: 2.5, tags: 2, effects: 2, require: {tension_gt: 70}}

# 边际递减：同一局第 2 件起倍率
quality_diminishing: [1.0, 0.8, 0.6]

# 品质出现概率**按幕次显式化**（S6-2）
#
# 缺省为空 = 仍走上面的 2d6 映射（行为零变化，golden 不动）。
# 填表后按权重抽（相对值，框架不解释大小）；每一幕一行，行内是各品质权重。
# 例：{1: {rough: 30, common: 50, fine: 15, rare: 5}, 3: {rough: 10, common: 40, fine: 30, rare: 18, legendary: 2}}
# ⚠️ **启用即改变掷定分布**：ironvale golden 需要同步更新（影响面在案，见回执）。
quality_weights:
  by_stage: {}

# 词缀（S6-1）：**词缀 × 槽位 × 品阶** 三维限定，价值在区间内取值。
#
# 为什么要三维：同一个词缀不是能挂在任何东西上（「锋锐」不该挂到盾上），
# 也不是任何品阶都配得上（低品阶不会带高价值词缀）。
#
# 字段：
# - `id` / `label`：词缀标识与显示名（中性词，具体含义由世界包解释）
# - `group`：互斥组 —— 同一件装备上同组词缀只能出现一个
# - `slots`：可出现的槽位（weapon/armor/shield/trinket/tool/consumable/outfit）
# - `tiers`：可出现的品阶（1~5）
# - `value_range`：价值区间（生成时在区间内取值，不写死）
# - `effect`：确定性效果（`{attr: atk}` = 给某个属性加 value）
# - `extra_fields`：写进实例自定义字段的键（**白名单由世界包声明**，框架不塞世界语义）
affixes:
  - id: aff_sharp
    label: 锋锐
    group: edge
    slots: [weapon]
    tiers: [1, 2, 3, 4, 5]
    value_range: [1, 2]
    effect: {attr: atk}

  - id: aff_heavy
    label: 沉重
    group: weight
    slots: [armor]
    tiers: [2, 3, 4, 5]
    value_range: [1, 1]
    effect: {attr: def}

  - id: aff_warded
    label: 护佑
    group: ward
    slots: [trinket]
    tiers: [1, 2, 3, 4, 5]
    value_range: [1, 3]
    effect: {attr: ward}


# 各时代允许的 tag（era 管合法性，不管强度档）
era_pool:
  medieval:
    allow: [blade, blunt, polearm, armor, shield, light, heavy, climb, light_source, heal,
            fire, stealth, disguise, document, tool, container, consumable, arcane]
  modern:
    allow: [blade, blunt, ranged, armor, light, climb, lockpick, light_source, heal,
            fire, stealth, tool, container, consumable]

# 定价：price = 10 * tier^2 * quality_mult * (1 + 0.2 * enhance)
pricing:
  base: 10
  tier_exp: 2
  enhance_factor: 0.2

# 初始配装预算：budget = 20 + 5 * (level - 1)
# 一期不用这个公式（报到装备走世界包 items.yaml 的 starter），三期局外成长才启用
starter_budget:
  base: 20
  per_level: 5

# 装备 tag 带来的 DC 修正（只在对应技能上生效；缺省表示不修正）
tag_dc_bonus:
  lockpick:     {skills: [撬锁], dc: -2}     # 撬锁工具组
  light_source: {skills: [观察], dc: -1}     # 提灯/夜视
  document:     {skills: [交涉], dc: -1}     # 证件、授权书

# 物品晋升阈值（分层定义见知识库 02.1 数据契约 §六）
# prop（叙事道具，只有名字）→ instance（有数值的装备实例）→ template（世界包模板，跨局）
promotion:
  prop_to_instance: 3      # 同局使用次数达标即升为实例
  instance_to_template: 3  # 跨局出现局数达标可升为模板
  require_review: true     # 升模板必须人工确认，禁止自动写入世界包

