  - id: M14
    name: 接口与前端
    layer: L6
    packages: [trpg/api]
    doc: 03-模块/M14-接口与前端/00-模块总述.md
    exposes: [app, routes]
    # M04：大厅 / 房间页要读全局人格库 `config/agents.yaml`（方案 35）
    depends_on: [M01, M02, M03, M04, M05, M06, M07, M08, M10, M12, M13, M18]
    status: 生效

  - id: M15
    name: 运维与部署
    layer: L7
    packages: [trpg/ops]
