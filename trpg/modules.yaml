    depends_on: [M01, M02, M03, M04, M05, M06, M08, M11, M13, M18]
    status: 生效

  - id: M13
    name: 回合编排
    layer: L4
    packages: [trpg/engine]
    doc: 03-模块/M13-回合编排/00-模块总述.md
    exposes: [GameLoop, apply_delta, TurnRecord]
    depends_on: [M01, M02, M03, M04, M06, M07, M08, M09, M10, M12, M18]
