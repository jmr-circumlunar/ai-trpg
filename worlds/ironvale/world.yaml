schema_version: 1

world_id: ironvale
name: 铁谷

# 一句话说清核心张力（直接进 GM prompt）
tone: |
  钟声停下之后，这座港城开始有人消失。
  没人承认见过那口钟被敲响，但每个人都在数剩下的日子。

style: 冷峻、克制，少形容词，多用具体的物与动作

default_era: medieval
default_region: north_port

taboos:
  - 不涉及现实政治与真实人物
  - 不做任何性内容
  - 不写针对未成年人的暴力细节
  - 不复述任何已有作品的情节

organizations:
  faction_guild:
    label: 港务行会
    attitude_to_player: 0
    resources: [货物, 通行, 账册]
  faction_church:
    label: 灰钟教会
    attitude_to_player: -1
    resources: [情报, 禁书, 钟楼]
  faction_watch:
    label: 夜巡队
    attitude_to_player: 1
    resources: [巡逻, 牢房, 通缉令]

# regions：label 用于叙事，entry 是该区域的落地地点 id
# （地点明细见 regions/<id>.md 的表格；地点 id 必须与表格第一列一致）
regions:
  north_port:
    label: 北港
    entry: loc_plaza
    adjacent: [old_quarter]
    # 港城有夜巡队，但行会当道：秩序只算中等
    order: medium
    authority: [npc_watch_captain]
  old_quarter:
    label: 旧城
    entry: loc_old_gate
    adjacent: [north_port]
    order: low
    authority: [npc_watch_captain]

# 日历：第 1 天是哪一天（真实日期 = start_date + (day - 1)）
# 有日历才能显示「1348年4月12日 星期日」；留空则退回「第 N 天」
calendar:
  start_date: 1348-04-12
