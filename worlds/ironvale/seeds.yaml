schema_version: 1

# 事件种子：只给骨架（类型 / 冲突 / 可选后果），具体情境由 GM 结合状态落地
seeds:
  - id: evt_bell_01
    era: [medieval]
    stage_range: [1, 2]
    type: mystery
    skeleton: 一个不该响的钟在无人时响了
    consequences: [引来守卫, 发现隐藏通道, 惊动某个东西]
    weight_base: 1.0

  - id: evt_ledger_01
    era: [medieval]
    stage_range: [1, 3]
    type: social
    skeleton: 有人拿出一本账册，说它记着镇上每个人的价码
    consequences: [有人当场翻脸, 账册被抢, 某个名字被划掉]
    weight_base: 1.0

  - id: evt_fog_01
    era: [medieval]
    stage_range: [1, 2]
    type: explore
    skeleton: 雾里出现一条地图上没有的巷子，走进去后街道反转
    consequences: [迷失, 找到旧入口, 遇到不该在这的人]
    weight_base: 1.0

  - id: evt_debt_01
    era: [medieval]
    stage_range: [2, 4]
    type: resource
    skeleton: 补给少了一半，有人说是老鼠，有人说是人
    consequences: [队伍互疑, 被迫提前行动, 发现偷窃者]
    weight_base: 0.9

  - id: evt_knife_01
    era: [medieval]
    stage_range: [2, 4]
    type: combat
    skeleton: 巷口有人等你，刀已经出了鞘
    consequences: [负伤, 暴露行踪, 抓到活口]
    weight_base: 1.0

  - id: evt_choir_01
    era: [medieval]
    stage_range: [3, 4]
    type: crisis
    skeleton: 整座城的钟同时敲响，所有灯在同一刻熄灭
    consequences: [秩序崩溃, 某个封印松动, 出现无法解释的目击者]
    weight_base: 0.8
