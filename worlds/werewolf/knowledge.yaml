# 知识视图（方案 38 / C67 / C68）：**agent 此刻知道什么 + 此刻该守的准则**。
#
# 为什么单独一个文件：
#   身份名、阵营含义、行话（银水/骗药/悍跳…）都是**世界内容**，框架里一个字都不写；
#   框架只负责「按视角裁剪」与「按阶段筛选」（见 trpg/agents/knowledge.py）。
#
# 三个纪律：
#   1. 裁剪只用现有单源（secrets 可见性 / 生死 / 本人笔记），不发明新规则；
#   2. 如实——没有的信息写「还没有」，不让模型脑补；
#   3. **分阶段**——首夜没有发言信息，就不给「谁可疑」这类准则。

enabled: true

# 进提示词的信息块（只能从这里选）
sections: [identity, alive, dead, notes, votes, speeches, stage]

# 哪些阶段算「夜里」/「白天」——框架不知道夜里是哪几个阶段，由世界包说
# 「信息隐藏期 / 信息公开期」——通用说法，不写「夜/昼」这种世界词。
phases:
  hidden: [night, night_skill, night_kill]
  open: [dawn, discuss, day_skill, vote, exile]

strategies:
  # ── 首夜：信息为零，只能布局，不能推理 ──
  - id: first_night_facts
    phase: hidden
    when: cycle == 1
    text: >-
      现在还没有人发言过：除了你自己和队友，你对其他人的了解为零。
      不要凭空推断谁可疑——这一夜没有推理空间，只有一手布局。

  - id: first_night_goal
    phase: hidden
    when: cycle == 1
    text: >-
      首夜刀口的价值不在「打中」，在「给白天留余地」：
      避开你打算发言的那个人的前后位（否则白天能用「刀口+金水」钉死他），
      优先去砍明天最可能被抗推的那一边（杀哪边快就砍哪边）。

  - id: first_night_no_self_kill
    phase: hidden
    when: cycle == 1
    text: >-
      除非有明确的战术目的，否则不要自刀：女巫不救你等于白丢一轮；
      她救了你你会变成银水，但银水身份存疑，而且真预言家验到你你就危险。

  # ── 自刀的条件（不是无条件建议；首夜尤其要想清楚代价）──
  - id: self_kill_conditions
    phase: hidden
    when: cycle >= 1
    text: >-
      考虑自刀骗药的前提：女巫这夜大概率会开解药；队里有人能接应你的发言；
      你能承担被真预言家验到的风险；而且这一局你需要的正是一个「好人牌」。
      不满足这些就别自刀——自刀是把两个风险一起买下来，不是稳赚。

  # ── 白天：这时才有发言、才有推理 ──
  - id: day_speech
    phase: open
    text: >-
      发言要给出三件事：你的立场、你怀疑谁、依据是什么。
      怀疑要落在「逻辑上像狼」的人身上，不是「最像好人」的人身上。

  - id: day_vote
    phase: open
    text: >-
      投票要和你白天表达的怀疑一致：不要一边说怀疑3号、一边投2号。
      票是你发言的结论，不是另开一局重新想。
